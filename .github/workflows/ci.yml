name: CI

# Every pull request, and the first step of every deploy: typecheck, lint, the unit tests (the
# infra tests among them) and the web build. No AWS access. See docs/features/pipeline.md.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Main's branch protection requires this job by its name, "check".
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A newer push to the same pull request cancels the run it replaces.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @library/web build
