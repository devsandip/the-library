name: Deploy

# The one way code reaches prod. Every push to main runs CI, deploys dev and runs the integration
# tests there, then deploys prod and runs the hosting checks. Pushes that change only docs skip it.
# See docs/features/pipeline.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "journal/**"
  workflow_dispatch:

# One deploy at a time, in order. A push that lands mid-run waits; a newer push replaces it there.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  dev:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GitHub lets only main use the dev and prod environments, and the AWS role trusts only them.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # The web app first: without web/dist, CDK deploys a placeholder page.
      - run: pnpm --filter @library/web build
      - run: pnpm cdk deploy -c stage=dev --require-approval never
      - run: pnpm test:int

  prod:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prod
      url: https://sandip.dev/thelibrary/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Builds the web app, then deploys prod.
      - run: pnpm run deploy
      - run: pnpm check-hosting
